<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authenticating - GRC Lab</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 150px; background-color: #f4f6f9; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #0056b3; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Signing in to Cyber Audit Portal...</h2>
    <p>Please wait while we verify your credentials and prepare your audit workspace.</p>
    <div id="errorMsg" style="color: red; margin-top: 20px; display: none;"></div>

    <script type="importmap">
    {
      "imports": {
        "keycloak-js": "./node_modules/keycloak-js/lib/keycloak.js"
      }
    }
    </script>

    <script type="module">
      import Keycloak from 'keycloak-js';
      
      const keycloak = new Keycloak({
        url: 'http://192.168.40.10:8080',
        realm: 'cyber-audit-portal',
        clientId: 'cyber-audit-portal-spa'
      });

      try {
        // Keycloak automatically parses the URL hash/parameters on init
        const authenticated = await keycloak.init({ 
            onLoad: 'check-sso',
            checkLoginIframe: false,
            scope: 'openid profile email audit-context-claims'
        });

        if (authenticated) {
            // Using replace() prevents the callback page from being stuck in the browser's "Back" button history
            window.location.replace('/dashboard.html');
        } else {
            // If they land here without being logged in, kick them to the front door
            window.location.replace('/index.html');
        }
      } catch (error) {
        console.error('Authentication processing failed:', error);
        document.getElementById('errorMsg').innerText = "Authentication failed. Please try again.";
        document.getElementById('errorMsg').style.display = "block";
      }
    </script>
</body>
</html>
